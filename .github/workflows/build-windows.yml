name: Build AutoMix

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: automix
    steps:
      - uses: actions/checkout@v4.1.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build AutoMix.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name AutoMix `
            --icon assets\automix.ico `
            --add-data "assets;assets" `
            automix_gui.py

      - name: Verify the exe was actually produced
        run: |
          if (!(Test-Path "dist\AutoMix.exe")) {
            Write-Error "Build did not produce dist\AutoMix.exe"
            exit 1
          }
          Get-Item dist\AutoMix.exe | Format-List Name, Length

      - name: Upload AutoMix.exe
        uses: actions/upload-artifact@v4.3.0
        with:
          name: AutoMix-windows
          path: automix/dist/AutoMix.exe
          retention-days: 90
